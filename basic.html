<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particles + Hand Tracking Preview</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        
        /* Main 3D Canvas */
        canvas.three-canvas { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: 1; 
        }

        /* UI Overlay - Top Left */
        #ui-layer {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 10;
            color: white;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(5px);
        }
        
        h1 { margin: 0 0 5px 0; font-size: 1.2rem; color: #00ffff; text-transform: uppercase; letter-spacing: 1px; }
        p { margin: 0; font-size: 0.85rem; color: #ccc; }
        .status { margin-top: 5px; font-weight: bold; color: #ff0055; }

        .controls {
            margin-top: 15px;
            pointer-events: auto;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        button:hover { background: rgba(0, 255, 255, 0.6); color: #000; box-shadow: 0 0 10px #00ffff; }

        /* CAMERA PREVIEW CONTAINER - Bottom Right */
        #preview-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 320px;
            height: 240px;
            z-index: 100;
            border: 2px solid #00ffff;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        /* The raw video (hidden, used for processing) */
        #input_video { display: none; }

        /* The canvas showing the video feed + skeleton drawing */
        #preview_canvas {
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Mirror effect */
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 1.5rem;
            z-index: 200;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="loading">Starting Camera & AI...<br><span style="font-size:0.9rem">Please allow camera access</span></div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <h1>Particle Core</h1>
        <p>🖐 <b>Open Hand:</b> Expand / Repel</p>
        <p>👌 <b>Pinch (Index+Thumb):</b> Contract / Attract</p>
        <div id="gesture-status" class="status">Waiting for hand...</div>
        
        <div class="controls">
            <button onclick="setShape('sphere')">Sphere</button>
            <button onclick="setShape('heart')">Heart</button>
            <button onclick="setShape('saturn')">Saturn</button>
            <button onclick="setShape('flower')">Flower</button>
            <button onclick="setShape('twist')">Twist</button>
        </div>
    </div>

    <!-- Camera Preview (Bottom Right) -->
    <div id="preview-container">
        <canvas id="preview_canvas"></canvas>
    </div>

    <!-- Raw Video (Hidden) -->
    <video id="input_video"></video>
    
    <!-- Three.js Container appended by script -->

    <!-- LIBRARIES -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // --- CONFIGURATION ---
        const PARTICLE_COUNT = 12000;
        const PARTICLE_SIZE = 0.2;
        const CAM_Z = 30;

        // --- VARIABLES ---
        let scene, camera, renderer, particles, geometry, material;
        let positions, colors, targetPositions;
        let time = 0;

        // Interaction State
        let handPosition = new THREE.Vector3(0, 0, 0);
        let isHandPresent = false;
        let isPinching = false;
        
        // --- 1. THREE.JS SETUP ---
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.02); // Dark fog

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = CAM_Z;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.domElement.className = 'three-canvas';
            document.body.appendChild(renderer.domElement);

            // Init Arrays
            positions = new Float32Array(PARTICLE_COUNT * 3);
            targetPositions = new Float32Array(PARTICLE_COUNT * 3);
            colors = new Float32Array(PARTICLE_COUNT * 3);

            // Initial Random Positions
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positions[i*3] = (Math.random() - 0.5) * 100;
                positions[i*3+1] = (Math.random() - 0.5) * 100;
                positions[i*3+2] = (Math.random() - 0.5) * 100;
                colors[i*3] = 0; colors[i*3+1] = 1; colors[i*3+2] = 1; // Cyan start
            }

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const texture = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/spark1.png');

            material = new THREE.PointsMaterial({
                size: PARTICLE_SIZE,
                map: texture,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.8
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            setShape('sphere');
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 2. SHAPE LOGIC ---
        window.setShape = function(type) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const idx = i * 3;
                const u = Math.random(); 
                const v = Math.random();
                const theta = 2 * Math.PI * u;
                const phi = Math.acos(2 * v - 1);
                
                let x, y, z;

                if (type === 'sphere') {
                    const r = 10;
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                } 
                else if (type === 'heart') {
                    const t = u * Math.PI * 2;
                    const r = 0.6; // Scale
                    const hx = 16 * Math.pow(Math.sin(t), 3);
                    const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    x = hx * r;
                    y = hy * r;
                    z = (v - 0.5) * 5; 
                } 
                else if (type === 'saturn') {
                    if (Math.random() > 0.4) {
                        const r = 5; 
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = r * Math.sin(phi) * Math.sin(theta);
                        z = r * Math.cos(phi);
                    } else {
                        const r = 8 + Math.random() * 5;
                        const ang = Math.random() * Math.PI * 2;
                        x = r * Math.cos(ang);
                        z = r * Math.sin(ang);
                        y = (Math.random() - 0.5);
                    }
                }
                else if (type === 'flower') {
                    const k = 5; 
                    const r = (8 * Math.cos(k * theta)) + 2; 
                    x = r * Math.cos(theta);
                    y = r * Math.sin(theta);
                    z = (v - 0.5) * 4;
                }
                else if (type === 'twist') {
                    const r = 5 + v * 5;
                    const spiral = u * Math.PI * 12;
                    x = r * Math.cos(spiral);
                    y = (u - 0.5) * 25;
                    z = r * Math.sin(spiral);
                }

                // Add randomness to prevent perfect lines
                targetPositions[idx] = x + (Math.random()-0.5);
                targetPositions[idx+1] = y + (Math.random()-0.5);
                targetPositions[idx+2] = z + (Math.random()-0.5);
            }
        };

        // --- 3. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            const pos = geometry.attributes.position.array;
            const col = geometry.attributes.color.array;

            // Map hand pos to world coordinates
            // Roughly mapping -1..1 to -20..20 depending on aspect
            const vectorX = handPosition.x * 30;
            const vectorY = handPosition.y * 20;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i * 3;
                const px = pos[ix];
                const py = pos[ix+1];
                const pz = pos[ix+2];

                const tx = targetPositions[ix];
                const ty = targetPositions[ix+1];
                const tz = targetPositions[ix+2];

                // Base movement towards shape
                // If pinching, shape hold is weak (0.01), if open, shape hold is stronger (0.05)
                const lerpBase = isPinching ? 0.005 : 0.03; 
                
                let vx = (tx - px) * lerpBase;
                let vy = (ty - py) * lerpBase;
                let vz = (tz - pz) * lerpBase;

                // Hand Physics
                if (isHandPresent) {
                    const dx = px - vectorX;
                    const dy = py - vectorY;
                    const dz = pz - 0; // Hand is at Z=0 plane
                    const distSq = dx*dx + dy*dy + dz*dz;
                    const dist = Math.sqrt(distSq);

                    if (isPinching) {
                        // CONTRACTION / GRAVITY WELL
                        // Pull particles tightly to hand
                        if (dist > 1.0) {
                            const force = 150 / (distSq + 0.1); 
                            vx -= dx * force * 0.01;
                            vy -= dy * force * 0.01;
                            vz -= dz * force * 0.01;
                        }
                        
                        // Color: Hot (Red/Yellow)
                        col[ix] = 1.0; 
                        col[ix+1] = Math.max(0, 1 - (10/dist)); 
                        col[ix+2] = 0.0;

                    } else {
                        // EXPANSION / FORCE FIELD
                        // Push particles away
                        if (dist < 12.0) {
                            const force = (12.0 - dist) * 0.08;
                            vx += dx * force * 0.05;
                            vy += dy * force * 0.05;
                            vz += dz * force * 0.05;
                        }

                        // Color: Cool (Cyan/Purple) when near hand
                        const intensity = Math.max(0, 1 - dist/15);
                        col[ix] = intensity * 0.5;
                        col[ix+1] = 1.0 - (intensity * 0.5);
                        col[ix+2] = 1.0;
                    }
                } else {
                    // Idle Colors
                    col[ix] = (Math.sin(px * 0.05 + time) + 1) * 0.2;
                    col[ix+1] = (Math.cos(py * 0.05 + time) + 1) * 0.5;
                    col[ix+2] = 1.0;
                }

                pos[ix] += vx;
                pos[ix+1] += vy;
                pos[ix+2] += vz;
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;
            
            // Slow rotation of container
            particles.rotation.y = time * 0.1;

            renderer.render(scene, camera);
        }

        // --- 4. MEDIAPIPE & PREVIEW ---
        const videoElement = document.getElementById('input_video');
        const previewCanvas = document.getElementById('preview_canvas');
        const canvasCtx = previewCanvas.getContext('2d');
        const statusText = document.getElementById('gesture-status');

        function onResults(results) {
            document.getElementById('loading').style.display = 'none';

            // 1. Draw to Preview Canvas
            previewCanvas.width = videoElement.videoWidth;
            previewCanvas.height = videoElement.videoHeight;
            
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            canvasCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandPresent = true;
                const landmarks = results.multiHandLandmarks[0];

                // Draw Skeleton
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00ffff', lineWidth: 5});
                drawLandmarks(canvasCtx, landmarks, {color: '#ff0055', lineWidth: 2, radius: 4});

                // Logic Calculation
                // 8 = Index Tip, 4 = Thumb Tip
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                
                // Distance in normalized coordinates
                const d = Math.sqrt(
                    Math.pow(indexTip.x - thumbTip.x, 2) + 
                    Math.pow(indexTip.y - thumbTip.y, 2)
                );

                // Pinch Threshold
                if (d < 0.08) {
                    isPinching = true;
                    statusText.innerText = "Status: PINCH (Contract)";
                    statusText.style.color = "#ff3300"; // Orange
                } else {
                    isPinching = false;
                    statusText.innerText = "Status: OPEN (Expand)";
                    statusText.style.color = "#00ffff"; // Cyan
                }

                // Update Hand Position (Mirror X)
                // Center is roughly Index finger or palm (using Index 8 here for precision)
                handPosition.x = (1 - indexTip.x) * 2 - 1; // Map 0..1 to -1..1
                handPosition.y = -(indexTip.y * 2 - 1);    // Map 0..1 to 1..-1 (ThreeJS Y is up)

            } else {
                isHandPresent = false;
                isPinching = false;
                statusText.innerText = "Status: No Hand Detected";
                statusText.style.color = "#ccc";
            }
            canvasCtx.restore();
        }

        // Initialize MediaPipe Hands
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 320,
            height: 240
        });
        
        // Start
        initThree();
        cameraUtils.start();
        animate();

    </script>
</body>
</html>
